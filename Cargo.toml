[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "apps/edge/src-tauri",
    "crates/rampage-protocol",
    "crates/rampage-ledger",
    "crates/rampage-policy",
    "crates/rampage-storage",
    "crates/rampage-mesh",
    "crates/rampage-relay",
    "crates/rampage-project",
    "crates/rampage-sdk",
    "crates/rampage-controller",
    "crates/rampage-agent",
    "crates/rampage-edge",
    "crates/rampage-cli",
    "crates/tauri-plugin-rampage-edge",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.91"
authors = ["ObtuseAI"]
repository = "https://github.com/obtuseai/rampage"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
aes-gcm = "0.11"
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
hex = "0.4"
hkdf = "0.12"
if-addrs = "0.15.0"
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.0.3", default-features = false, features = ["server", "tls-ring"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
sysinfo = "0.38"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
webpki-types = { package = "rustls-pki-types", version = "1.12" }
windows = "=0.62.2"
windows-core = "=0.62.2"
walkdir = "2.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
