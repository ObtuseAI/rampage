name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust trust and control planes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Prepare Tauri external-binary compile sentinels
        shell: pwsh
        run: |
          # Tauri validates externalBin paths while compiling the desktop shell. Release packaging
          # replaces these sentinels with the real, freshly built sidecars in Build-Rampage.ps1.
          $binaryDir = 'apps/desktop/src-tauri/binaries'
          New-Item -ItemType Directory -Path $binaryDir -Force | Out-Null
          @('rampage-controller', 'rampage-agent', 'rampage', 'rampage-relay', 'rampage-intelligence') |
            ForEach-Object {
              New-Item -ItemType File -Path "$binaryDir/$($_)-x86_64-pc-windows-msvc.exe" -Force | Out-Null
            }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce vulnerability-free, target-qualified RustSec baseline
        shell: pwsh
        run: .\scripts\Assert-RustSecBaseline.ps1
      - name: Build native sidecars
        run: cargo build -p rampage-controller -p rampage-agent -p rampage-relay
      - name: Qualify OpenAI-compatible model gateway
        shell: pwsh
        run: .\scripts\model-gateway-e2e.ps1

  typescript:
    name: Desktop and TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.8
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  python:
    name: Proposal-only intelligence and Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --project services/intelligence --extra dev --locked
      - run: uv run --project services/intelligence ruff check services/intelligence packages/sdk-python
      - run: uv run --project services/intelligence mypy services/intelligence/src
      - run: uv run --project services/intelligence pytest services/intelligence/tests
      - name: Test Python SDK
        env:
          PYTHONPATH: packages/sdk-python/src
        run: uv run --project packages/sdk-python --with pytest pytest packages/sdk-python/tests

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
