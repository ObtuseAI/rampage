[project]
name = "rampage-intelligence"
version = "0.2.1"
description = "Durable, proposal-only intelligence plane for Rampage"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-ai[dbos]>=1.0",
  "pydantic-settings>=2.10",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[project.scripts]
rampage-intelligence = "rampage_intelligence.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rampage_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

